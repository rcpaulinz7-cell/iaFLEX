name: Trabalhador IA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  executar-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Executar Agente
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/agent.py "Executando via GitHub Actions"

      - name: Salvar Memória e Commit
        run: |
          git config --global user.name "iaFLEX Bot"
          git config --global user.email "bot@iaflex.local"
          git add memory/knowledge.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar memoria da IA [skip ci]" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)
